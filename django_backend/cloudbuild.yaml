# Cloud Build Configuration for ESP32 EVM Django Backend
# Automated deployment pipeline for Google Cloud Platform

steps:
  # Install dependencies
  - name: 'python:3.9'
    entrypoint: pip
    args: ['install', '-r', 'requirements_production.txt']

  # Run tests
  - name: 'python:3.9'
    entrypoint: python
    args: ['manage.py', 'test', '--settings=evm_backend.settings_production']
    env:
      - 'SECRET_KEY=test-secret-key-for-build'
      - 'DEBUG=False'
      - 'ALLOWED_HOSTS=localhost'

  # Collect static files
  - name: 'python:3.9'
    entrypoint: python
    args: ['manage.py', 'collectstatic', '--noinput', '--settings=evm_backend.settings_production']
    env:
      - 'SECRET_KEY=test-secret-key-for-build'
      - 'DEBUG=False'
      - 'ALLOWED_HOSTS=localhost'

  # Deploy to App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['app', 'deploy', '--quiet']

# Build timeout
timeout: '1200s'

# Substitutions for environment-specific builds
substitutions:
  _ENVIRONMENT: 'production'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY